<!DOCTYPE html>
<html>

<head>

    <title>HR Interview Selection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef1f4;
            margin: 0;
            padding: 50px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #message {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            background: #f1f1f1;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>HR Interview Selection</h1>

    <div class="subtitle">
        Candidate Selection Microservice
    </div>


    <form id="candidateForm">

        <label>Candidate ID</label>

        <input
            type="number"
            id="id"
            required
        >


        <label>Candidate Name</label>

        <input
            type="text"
            id="name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >


        <label>Position</label>

        <input
            type="text"
            id="position"
            placeholder="Example: Software Developer"
            required
        >


        <button type="submit">
            Select Candidate
        </button>

    </form>


    <div id="message"></div>

</div>


<script>

document.getElementById("candidateForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const candidate = {

        id: Number(
            document.getElementById("id").value
        ),

        name:
            document.getElementById("name").value,

        email:
            document.getElementById("email").value,

        position:
            document.getElementById("position").value
    };


    const response = await fetch(
        "/candidates/select",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(candidate)
        }
    );


    const result = await response.text();


    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.innerText = result;

});

</script>

</body>

</html>
