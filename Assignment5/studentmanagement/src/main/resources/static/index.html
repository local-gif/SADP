<!DOCTYPE html>
<html>
<head>

    <title>Student Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            border-radius: 7px;
            display: none;
        }

        .student-list {
            margin-top: 25px;
        }

        .student {
            background: #f5f5f5;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Management</h1>

    <div class="subtitle">
        Spring Boot Student Microservice
    </div>

    <form id="studentForm">

        <label>Roll Number</label>
        <input type="number" id="rollNo" required>

        <label>Student Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Course</label>
        <input type="text" id="course" placeholder="e.g. MSc Computer Science" required>

        <label>Semester</label>
        <input type="number" id="semester" min="1" max="6" required>

        <button type="submit">
            Add Student
        </button>

    </form>

    <div id="message"></div>

    <button onclick="showStudents()">
        View All Students
    </button>

    <div id="students" class="student-list"></div>

</div>


<script>

document.getElementById("studentForm").addEventListener("submit",
    async function(event) {

        event.preventDefault();

        const student = {

            rollNo: Number(document.getElementById("rollNo").value),

            name: document.getElementById("name").value,

            email: document.getElementById("email").value,

            course: document.getElementById("course").value,

            semester: Number(document.getElementById("semester").value)
        };

        const response = await fetch("/students", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(student)
        });

        const result = await response.text();

        const message = document.getElementById("message");

        message.style.display = "block";

        message.innerText = result;

        if (result === "Student added successfully.") {
            document.getElementById("studentForm").reset();
        }
    });


async function showStudents() {

    const response = await fetch("/students");

    const students = await response.json();

    const container = document.getElementById("students");

    container.innerHTML = "";

    if (students.length === 0) {

        container.innerHTML = "<p>No students available.</p>";

        return;
    }

    students.forEach(student => {

        container.innerHTML += `

            <div class="student">

                <b>Roll No:</b> ${student.rollNo}<br>

                <b>Name:</b> ${student.name}<br>

                <b>Email:</b> ${student.email}<br>

                <b>Course:</b> ${student.course}<br>

                <b>Semester:</b> ${student.semester}

            </div>

        `;
    });
}

</script>

</body>
</html>
